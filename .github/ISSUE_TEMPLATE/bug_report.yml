name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Security problems belong in a private report, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prompt Saver version
      placeholder: "2.6.3"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Installed or portable?
      options:
        - Installed
        - Portable
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2, x64"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Screenshots help. Please remove prompts or file names you consider private before posting.

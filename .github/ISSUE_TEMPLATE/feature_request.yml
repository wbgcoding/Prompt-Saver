name: Feature request
description: An idea for a new feature or a better workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Prompt Saver help? Sketches and screenshots are welcome.

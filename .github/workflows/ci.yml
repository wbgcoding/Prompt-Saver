name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # Pinned to a commit, not a movable tag: the tag owner cannot
      # silently swap out what runs here (supply-chain hardening).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # pdfium.dll is compiled into the exe, so even a test build needs it.
      - name: Fetch pdfium
        run: |
          Invoke-WebRequest https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz -OutFile pdfium.tgz
          tar -xzf pdfium.tgz bin/pdfium.dll
          Move-Item bin/pdfium.dll src-tauri/pdfium.dll

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-

      - run: npm ci

      - name: Dependency advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
        working-directory: src-tauri

      - name: Rust unit tests
        run: cargo test --lib
        working-directory: src-tauri

      - name: Rust lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Frontend syntax
        run: |
          Get-ChildItem ui -Filter *.js | ForEach-Object { node --check $_.FullName }

      - name: Source hygiene
        run: python tests/source_hygiene.py

      - name: Translation key parity
        run: node tests/i18n_check.js

      - name: Fork vocabulary
        run: node tests/terms_check.js

      - name: Voice vocabulary
        run: node tests/voice_check.js

      - name: Expert menu
        run: python tests/expert_menu_check.py

      - name: Tooltip coverage
        run: python tests/tooltip_check.py

      - name: Flag polarity
        run: python tests/flag_polarity.py

      # Both drive a headless browser; the runner image ships Chrome.
      - name: UI smoke test
        run: python tests/ui/smoke_test.py

      - name: Modal layout
        run: python tests/layout/modal_scroll_test.py

      - name: Hot-path timing (1000 prompts)
        run: python tests/perf_hot_paths.py

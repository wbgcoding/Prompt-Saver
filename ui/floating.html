<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <link rel="stylesheet" href="styles/floating.css" />
  <link rel="stylesheet" href="styles/media.css" />
  <!-- i18n.js is a multi-megabyte dictionary; preloading it (and the small
       terms.js it always loads alongside) lets the browser start fetching
       both during HTML parsing, before floating.js even runs its first import. -->
  <link rel="modulepreload" href="i18n.js" />
  <link rel="modulepreload" href="terms.js" />
</head>
<body>
  <button id="pill" class="pill" type="button">
    <img id="img" class="pill-img hidden" alt="" draggable="false" />
    <video id="video" class="pill-video hidden" muted loop autoplay playsinline></video>
    <span id="label" class="label"></span>
    <span id="caption" class="pill-caption hidden"></span>
    <span id="rotate-badge" class="rotate-badge hidden"></span>
    <span id="parked-badge" class="parked-badge hidden"></span>
    <span id="feedback" class="feedback" role="status" aria-live="polite"></span>
    <span id="file-error" class="file-error"></span>
  </button>

  <!-- Resize the pill by grabbing its edge. A stadium-shaped RING (rz-catch = the
       full pill shape, with rz-hole punching out the centre) hugs the rounded
       outline at ANY size, so the resize hitbox is always right at the edge. The
       inner hole + the transparent corners stay free for dragging/copying. -->
  <div id="resize" class="resize">
    <div id="rz-catch" class="rz-catch"></div>
    <div id="rz-hole" class="rz-hole"></div>
  </div>

  <!-- Right-click menu: size presets, edit prompt, remove pill -->
  <div id="menu" class="menu hidden">
    <div class="size-row">
      <span id="size-label" class="size-label"></span>
      <button type="button" data-scale="1.25">S</button>
      <button type="button" data-scale="2">M</button>
      <button type="button" data-scale="3">L</button>
      <button id="menu-close" type="button" class="menu-close">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4Z"/>
        </svg>
      </button>
    </div>
    <button id="menu-edit" type="button"></button>
    <button id="menu-hide" type="button"></button>
    <button id="menu-remove" type="button" class="danger"></button>
  </div>

  <script type="module" src="floating.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <link rel="stylesheet" href="styles/floating.css" />
</head>
<body class="vars-body">
  <!-- Placeholder prompt for copies started OUTSIDE the app (global hotkey, tray).
       A form and nothing else: the main window decides which rows appear here and
       what happens with the answers, so the app the user is in never comes forward. -->
  <div id="card" class="vars-card">
    <h1 id="title" class="vars-title"></h1>
    <div id="fields" class="vars-fields"></div>
    <div class="vars-actions">
      <button id="cancel" type="button" class="vars-btn"></button>
      <button id="ok" type="button" class="vars-btn vars-btn-primary"></button>
    </div>
  </div>

  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script type="module" src="vars.js"></script>
</body>
</html>

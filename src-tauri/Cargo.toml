[package]
name = "prompt-saver"
version = "3.1.0"
description = "Local offline prompt manager"
authors = ["BGCoding"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "prompt_saver_lib"
# Desktop-only: rlib suffices (staticlib/cdylib are for mobile targets).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
# Used only to parse `cargo metadata` output while generating the third-party
# license list; same versions as the runtime dependencies below.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dependencies]
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
# Optional global hotkey to summon the window + quick-launcher.
tauri-plugin-global-shortcut = "=2.4.1"
# Async timer to re-assert snip overlay geometry after the per-monitor DPI settle.
# "net" enables the named pipe that carries a second command-line launch's
# request to the already-running instance and its answer back; "rt" is the
# small standalone runtime that launch waits on it with, since nothing has
# started Tauri's own runtime yet at that point. "sync" (Notify) and "macros"
# (select!) drive the folder sync's wake-up and its loop.
tokio = { version = "=1.54.1", features = ["time", "net", "rt", "sync", "macros"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
arboard = "=3.7.0"
rfd = "=0.17.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff", "tga", "gif"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
# Verify the SHA-256 of a downloaded update against the hash published in the release.
# Ed25519 check of signed updates; already in the tree through rustls.
ring = "=0.17.14"
# Encrypted single-file backups: AES-256-GCM (ring) + Argon2id password KDF (no
# system/OpenSSL dependency). Default backups use a fixed key (portable); an optional
# user password derives a stronger key.
argon2 = "=0.6.0"
zeroize = "=1.9.1"
# Backups are compressed before they are written (snapshots) or encrypted (.psb).
flate2 = "=1.1.10"
# Fast snip preview: SIMD JPEG encoder.
jpeg-encoder = "=0.7.1"
# Local SQLite store (bundled engine, no system dependency).
rusqlite = { version = "=0.41.1", features = ["bundled"] }
# Render the first page of an attached PDF as a preview image. Binds the
# pdfium library dynamically at runtime (the DLL is embedded in the exe and
# unpacked on first use - see pdfium_lib_path in images.rs).
pdfium-render = "=0.9.4"
# Extract ffmpeg.exe from its downloaded release zip. Deflate only:
# gyan.dev's archive needs no other compression method.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.3"
# OCR: Windows' own built-in text recognizer, fully offline. Version
# pinned exactly -- a newer release may need a newer compiler than this project's
# rust-version = "1.99".
windows = { version = "=0.62.2", features = [
  "Media_Ocr", "Graphics_Imaging", "Storage",
  # 125: voice dictation (Windows.Media.SpeechRecognition), same crate as OCR.
  "Media_SpeechRecognition",
  "Globalization", "Win32_System_WinRT",
  # 122: elevated install launch (ShellExecuteW) for OCR language packs.
  "Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
  # Authenticode check (WinVerifyTrust) on the downloaded WebView2 bootstrapper
  # before it is ever run. Win32_Security_Cryptography is needed for the
  # WINTRUST_DATA struct itself, not just the WinTrust function bindings.
  "Win32_Security_WinTrust", "Win32_Security_Cryptography",
  # The WTHelper* functions that read the signing certificate out of that check
  # (the signer must be Microsoft) are gated behind these two.
  "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip",
  # Telling "this account can never elevate" from "the UAC prompt was just
  # declined" (GetTokenInformation/TokenElevationType) for the OCR/voice
  # language-pack elevation path above.
  "Win32_Security",
  # Local-time recording filenames (GetLocalTime).
  "Win32_System_SystemInformation",
  # WASAPI loopback (system audio) + microphone capture for recordings.
  "Win32_Media_Audio",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  # Job object so a quit never leaves an ffmpeg child running on its own.
  "Win32_System_JobObjects",
  "Win32_System_Threading", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem",
  # Free-disk-space check (GetDiskFreeSpaceExW) ahead of a recording or export.
  "Win32_Storage_FileSystem",
  # Console attach so a windowless command-line launch can print to the
  # caller's own console instead of a subsystem:windows app going silent.
  "Win32_System_Console",
  # 463: system-wide low-level keyboard hook for the key-overlay capture
  # (WH_KEYBOARD_LL lives in Win32_UI_WindowsAndMessaging, already above) plus
  # UI Automation's IsPassword property, the primary password-field signal.
  "Win32_UI_Accessibility",
  # GetAsyncKeyState: confirms the hook's own tracked Ctrl/Alt/Win state
  # against the live keyboard so a key-up the hook never saw (an elevated
  # window or the secure desktop swallowing it) cannot leave a modifier
  # stuck "held" forever.
  "Win32_UI_Input_KeyboardAndMouse",
  # The registry values read and written through registry.rs (autostart, speech consent).
  "Win32_System_Registry",
] }
# The #[implement] macro's generated code names the `windows_core` crate
# directly, so it has to be a real, nameable dependency of this crate under
# that exact name, pinned to the same release as `windows` above. One release
# serves windows-capture, webview2-com and tauri as well, so every crate in the
# build agrees on one ABI.
windows-core = "=0.100.0"
# Screen recording: Windows Graphics Capture + its own Media
# Foundation H.264/MP4 encoder, vetted against a real desktop before use.
# Uses the same `windows` release as pinned above.
windows-capture = "=2.0.1"
# The exact webview2-com release wry/tauri already resolve internally
# (checked against Cargo.lock), so ICoreWebView2Controller/ICoreWebView2 here
# are the SAME type the WebviewWindow hands back from with_webview -- a
# mismatched version would fail to compile at that boundary instead of just
# warning. Used only to answer the camera window's getUserMedia permission
# prompt in Rust; WebView2 blocks the request forever otherwise.
webview2-com = "=0.39.1"

# Small release binary, but tuned for much faster builds:
# thin LTO + parallel codegen cut compile time a lot for a few KB more size.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
# NOTE: unwind (not "abort") so a single command panic rejects the call
# instead of hard-crashing the whole app. Robustness > a few KB of size.
strip = true
# NOTE: the shipped exe must not carry the paths of the machine it was built on.
# `strip` drops the debug info, but panic locations from dependencies stay in the
# binary as literals; build.bat remaps them via RUSTFLAGS (profile.trim-paths is
# still nightly-only).
# Incremental is OFF on purpose: its codegen cache added ~2.8 GB to target/ for only
# a few seconds off repeat builds. Deps still stay compiled in target/release/deps
# (cached, never re-downloaded), so only this one crate recompiles per change.
incremental = false

# The ffmpeg archive (about 100 MB) is hashed and inflated on the user's machine:
# at opt-level "z" (and unoptimized in dev builds) those few hot loops ran several
# times slower. Optimizing just these small crates costs a few KB of exe size.
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3
[profile.release.package.zip]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.adler2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3

[package]
name = "prompt-saver"
version = "2.6.2"
description = "Local offline prompt manager"
authors = ["BG Coding"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "prompt_saver_lib"
# Desktop-only: rlib suffices (staticlib/cdylib are for mobile targets).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
# Optional global hotkey to summon the window + quick-launcher.
tauri-plugin-global-shortcut = "2"
# Async timer to re-assert snip overlay geometry after the per-monitor DPI settle.
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.15"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff", "tga", "gif"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
# Verify the SHA-256 of a downloaded update against the hash published in the release.
sha2 = "0.10"
# Encrypted single-file backups: AES-256-GCM + Argon2id password KDF (pure Rust, no
# system/OpenSSL dependency). Default backups use a fixed key (portable); an optional
# user password derives a stronger key.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
# Backups are compressed before they are written (snapshots) or encrypted (.psb).
flate2 = "1"
# Screen capture for the built-in snipping tool (pure Rust, no external dll).
xcap = "0.0.14"
# Fast snip preview: SIMD JPEG (jpeg-encoder) + rayon to parallelize the BGRA→RGBA
# conversion of a multi-monitor capture.
rayon = "1"
jpeg-encoder = "0.6"
# Local SQLite store (bundled engine — no system dependency).
rusqlite = { version = "0.32", features = ["bundled"] }
# Render the first page of an attached PDF as a preview image. Binds the
# pdfium library dynamically at runtime (shipped as a resource next to the exe).
pdfium-render = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
clipboard-win = "5"

# Small release binary, but tuned for much faster builds:
# thin LTO + parallel codegen cut compile time a lot for a few KB more size.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
# NOTE: unwind (not "abort") so a single command panic rejects the call
# instead of hard-crashing the whole app. Robustness > a few KB of size.
strip = true
# Incremental is OFF on purpose: its codegen cache added ~2.8 GB to target/ for only
# a few seconds off repeat builds. Deps still stay compiled in target/release/deps
# (cached, never re-downloaded), so only this one crate recompiles per change.
incremental = false
